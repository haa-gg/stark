<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stark AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="settings-view">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2 style="margin: 0;">Stark Configuration</h2>
      <button id="close-settings" title="Close Settings" style="background: transparent; color: var(--text-main); font-size: 20px; padding: 0;">✖</button>
    </div>
    
    <div class="input-group" style="display: flex; justify-content: space-between; align-items: center; background: var(--panel-bg); padding: 10px; border-radius: 4px; border: 1px solid var(--border-color);">
      <label style="margin: 0; cursor: pointer;" for="theme-toggle">Light Mode</label>
      <input type="checkbox" id="theme-toggle" style="width: auto; cursor: pointer;">
    </div>

    <div class="input-group">
      <label>Gemini API Key</label>
      <div style="display: flex; gap: 5px; margin-bottom: 5px;">
        <input type="password" id="api-key" placeholder="AIzaSy..." style="flex-grow: 1;">
        <button id="toggle-api-key" style="padding: 5px 10px; font-size: 14px;" title="Toggle Visibility">👁</button>
      </div>
      <small><a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: var(--accent-gold); text-decoration: none;">Get a free API key here</a></small>
    </div>
    <div class="input-group">
      <label>Campaign Notes (Google Doc URL)</label>
      <input type="text" id="notes-url" placeholder="https://docs.google.com/document/d/...">
      <div id="google-auth-section" style="margin-top: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
        <button id="connect-google-btn" style="padding: 5px 10px; font-size: 12px;">🔗 Connect Google Account</button>
        <span id="google-auth-status" style="font-size: 12px; color: var(--meter-safe); display: none;">✓ Connected</span>
        <button id="disconnect-google-btn" style="display: none; background: transparent; border: 1px solid var(--meter-danger); color: var(--meter-danger); font-size: 11px; padding: 3px 7px;">Disconnect</button>
      </div>
      <small style="display: block; margin-top: 6px;">Connect your account once — Stark will automatically read all tabs in your doc.</small>
    </div>
    <div class="input-group">
      <label>Pathbuilder JSON URLs</label>
      <textarea id="pb-urls" placeholder="https://pathbuilder2e.com/json.php?id=123456 (one per line)"></textarea>
    </div>
    <div class="input-group">
      <label for="routing-mode">Context Routing Mode</label>
      <select id="routing-mode" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff;">
        <option value="smart">Smart Auto (Saves tokens)</option>
        <option value="manual">Manual (Checkboxes in chat)</option>
        <option value="all">Load All (Slowest, uses max tokens)</option>
      </select>
    </div>
    <button id="save-settings" style="margin-top: 10px;">Save & Start</button>
  </div>

  <div id="chat-view" class="hidden">
    <div class="chat-header">
      <h2>Stark AI</h2>
      <div>
        <button id="sync-btn" title="Force Sync Data">↻</button>
        <button id="open-settings" title="Settings">⚙</button>
        <button id="close-panel" title="Close Panel" style="margin-left: 5px;">✖</button>
      </div>
    </div>
    <div id="chat-messages"></div>
    <div style="display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px;">
      <div class="chat-input-area" style="margin-bottom: 0;">
        <textarea id="chat-input" placeholder="Ask about rules, campaign, or your characters..."></textarea>
        <button id="send-btn">Send</button>
      </div>
      <div id="manual-routing-options" style="display: none; flex-wrap: wrap; gap: 8px; font-size: 11px;">
        <!-- Dynamically populated by JS -->
      </div>
    </div>
    <div id="token-meter-container">
      <div id="token-meter-bar"></div>
      <span id="token-meter-text">Tokens: 0 / 250,000</span>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
