<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stark AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="settings-view">
    <h2>Stark Configuration</h2>
    <div class="input-group">
      <label>Gemini API Key</label>
      <input type="password" id="api-key" placeholder="AIzaSy...">
    </div>
    <div class="input-group">
      <label>Campaign Notes (Google Doc URL)</label>
      <input type="text" id="notes-url" placeholder="https://docs.google.com/document/d/...">
      <small>Note: Doc must be 'Published to web'</small>
    </div>
    <div class="input-group">
      <label>Pathbuilder JSON URLs</label>
      <textarea id="pb-urls" placeholder="https://pathbuilder2e.com/json.php?id=123456 (one per line)"></textarea>
    </div>
    <button id="save-settings">Save & Start</button>
  </div>

  <div id="chat-view" class="hidden">
    <div class="chat-header">
      <h2>Stark AI</h2>
      <button id="open-settings">⚙️</button>
    </div>
    <div id="chat-messages"></div>
    <div class="chat-input-area">
      <textarea id="chat-input" placeholder="Ask about rules, campaign, or your characters..."></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
